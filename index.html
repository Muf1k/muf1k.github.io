<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mufik's Home</title>
<link rel="icon" type="image/x-icon" href="/images/original.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d12;
    --bg-panel: #10141b;
    --line: #232a35;
    --text: #e6e9ef;
    --muted: #7c8798;
    --green: #4ade80;
    --amber: #ffb454;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, rgba(74,222,128,0.06), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(255,180,84,0.05), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 64px 20px 40px;
  }

  .prompt{
    font-family:'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: .02em;
    margin-bottom: 10px;
  }
  .prompt .user{ color: var(--green); }
  .prompt .path{ color: var(--amber); }
  .cursor{
    display:inline-block;
    width:8px; height:16px;
    background: var(--green);
    margin-left:4px;
    vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .header-row{
    display:flex;
    align-items:center;
    gap: 16px;
    margin-bottom: 6px;
  }
  .avatar{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--line);
    background: var(--bg-panel);
  }

  h1{
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 span{ color: var(--green); }

  .tagline{
    color: var(--muted);
    font-size: 15px;
    max-width: 440px;
    text-align:center;
    line-height:1.5;
    margin: 0 0 40px;
  }

  .github-link{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    text-decoration:none;
    margin-bottom: 28px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 20px;
    transition: color .15s ease, border-color .15s ease;
  }
  .github-link:hover{
    color: var(--green);
    border-color: var(--green);
  }

  nav{
    width:100%;
    max-width: 420px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg-panel);
    overflow: hidden;
    margin-bottom: 28px;
  }
  nav a{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 16px 20px;
    color: var(--text);
    text-decoration:none;
    font-size: 15px;
    font-weight: 500;
    border-bottom: 1px solid var(--line);
    transition: background .15s ease, padding-left .15s ease;
  }
  nav a:last-child{ border-bottom:none; }
  nav a:hover{ background: rgba(74,222,128,0.06); padding-left: 26px; }
  nav a .key{
    font-family:'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 13px;
    width: 18px;
    flex-shrink:0;
  }
  nav a:hover .key{ color: var(--green); }
  nav a .emoji{ font-size:16px; }

  .spotify-wrap{
    margin: 6px 0 36px;
    border-radius: 12px;
    overflow:hidden;
    border: 1px solid var(--line);
    max-width: 420px;
    width:100%;
    line-height:0;
  }
  .spotify-wrap img{ width:100%; display:block; }

  footer{
    margin-top: auto;
    padding-top: 30px;
  }
  footer a{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    text-decoration:none;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 2px;
    transition: color .15s ease;
  }
  footer a:hover{ color: var(--amber); }
</style>
</head>
<body>

  <div class="prompt"><span class="user">guest</span>@<span class="path">muf1k</span>:~$<span class="cursor"></span></div>

  <div class="header-row">
    <img src="/images/original.png" alt="Mufik avatar" class="avatar">
    <h1>Muf<span>1</span>k</h1>
  </div>
  <p class="tagline">
    Hi, I'm Jacob — from Czechia, learning HTML one page at a time.
  </p>

  <a href="https://github.com/Muf1k" class="github-link" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
      0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
      -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
      .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
      -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
      1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
      1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
      1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
    github.com/Muf1k
  </a>

  <nav>
    <a href="https://muf1k.github.io/CZ"><span class="emoji">🇨🇿</span> Česky</a>
    <a href="https://muf1k.github.io/EN"><span class="emoji">🇬🇧</span> English</a>
    <a href="https://muf1k.github.io/chess"><span class="emoji">♟️</span> Chess <span style="color:var(--muted); font-weight:400;">— beta</span></a>
    <a href="https://muf1k.github.io/games"><span class="emoji">🎮</span> Games to try</a>
  </nav>

  <p align="center" class="spotify-wrap">
    <a href="https://spotify-github-profile.kittinanx.com/api/view?uid=31xa23l2dt2ghz745sz35asrx3fi&redirect=true">
      <img src="https://spotify-github-profile.kittinanx.com/api/view?uid=31xa23l2dt2ghz745sz35asrx3fi&cover_image=true&theme=spotify-embed&show_offline=false&background_color=121212&interchange=false&profanity=false&hide_remaster=false&bar_color=53b14f&bar_color_cover=false&mode=dark">
    </a>
  </p>

  <footer>
    <a href="https://www.jakpsatweb.cz/html/">HTML příručka 💻</a>
  </footer>

</body>
</html>
